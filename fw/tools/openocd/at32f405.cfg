# Generic Cortex-M over CMSIS-DAP. OpenOCD upstream has no AT32F402/405 target,
# but halt/read/write over SWD needs no part knowledge.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 2000

source [find target/swj-dp.tcl]

set _CHIPNAME at32f405
swj_newdap $_CHIPNAME cpu -enable
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap

$_CHIPNAME.cpu configure -work-area-phys 0x20000000 -work-area-size 0x4000 -work-area-backup 0
